[project]
name = "halo-agents"
version = "0.1.0"
description = "CrewAI agent runtime for Halo. Every model call is cost-governed through the api's internal routes."
requires-python = ">=3.11"
dependencies = [
  "crewai>=1.0,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["halo_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
