# Production stack. Everything reachable from outside the host goes through
# Caddy (TLS); datastores bind to 127.0.0.1 so they are never exposed.
#
# Required in .env: POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD,
# DESCOPE_PROJECT_ID, SECRETS_ENCRYPTION_KEY, INTERNAL_API_TOKEN.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: halo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-halo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-halo_prod}
    ports:
      # Localhost only: psql and backups reach it over SSH, the internet cannot.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-halo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: halo-redis
    restart: unless-stopped
    # The password is read from the environment at start-up rather than
    # interpolated into `command`. Compose substitutes ${...} at parse time,
    # so the literal password would otherwise end up in the container Cmd and
    # be visible in `docker inspect`. $$ escapes the $ so the shell, not
    # compose, expands it.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # Must authenticate: a password-protected redis answers NOAUTH to a bare
      # ping, so the previous check could report healthy for the wrong reason.
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio is no longer published on Docker Hub; RustFS speaks the
    # same S3 API on the same ports. The MINIO_* names are kept so the api's
    # S3_ACCESS_KEY / S3_SECRET_KEY wiring below is unchanged.
    image: rustfs/rustfs:latest
    container_name: halo-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # LibreOffice behind an HTTP API: converts generated Word documents to
  # PDF. Reached only from the api over the compose network.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: halo-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-disable-routes=true

  # One-shot: applies pending migrations then exits. api and worker wait for it
  # to complete successfully, so a deploy can never serve traffic against an
  # unmigrated schema. Runs from /app, hence the explicit --schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: halo-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # An explicit DATABASE_URL in .env wins, so the connection_limit /
      # pool_timeout tuning from the runbook is preserved.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-halo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-halo_prod}?schema=public}
    command: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: halo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-halo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-halo_prod}?schema=public}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.haloacquisitions.com}
      # Caddy is the only hop in front of the api, so trust exactly one proxy.
      # Without this req.protocol is http and Twilio signature checks fail.
      TRUST_PROXY: ${TRUST_PROXY:-1}

      DESCOPE_PROJECT_ID: ${DESCOPE_PROJECT_ID:?Set DESCOPE_PROJECT_ID}
      DESCOPE_MANAGEMENT_KEY: ${DESCOPE_MANAGEMENT_KEY:-}
      DESCOPE_BASE_URL: ${DESCOPE_BASE_URL:-}

      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Set SECRETS_ENCRYPTION_KEY}
      PII_ENCRYPTION_KEY_V1: ${PII_ENCRYPTION_KEY_V1:?Set PII_ENCRYPTION_KEY_V1 (openssl rand -hex 32)}
      PII_ENCRYPTION_KEY_CURRENT_VERSION: ${PII_ENCRYPTION_KEY_CURRENT_VERSION:-1}
      PII_INDEX_KEY: ${PII_INDEX_KEY:?Set PII_INDEX_KEY (openssl rand -hex 32)}
      # Shared secret for worker to api /internal calls.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      MLS_PROVIDER: ${MLS_PROVIDER:-}
      MLS_BASE_URL: ${MLS_BASE_URL:-}
      MLS_DATASET: ${MLS_DATASET:-}
      MLS_API_TOKEN: ${MLS_API_TOKEN:-}
      MLS_USERNAME: ${MLS_USERNAME:-}
      MLS_PASSWORD: ${MLS_PASSWORD:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_DAILY_COST_CAP: ${OPENAI_DAILY_COST_CAP:-5}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Messaging compliance: email is refused until the first three are set.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.haloacquisitions.com/api}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      HALO_CONTRACTING_ENTITY: ${HALO_CONTRACTING_ENTITY:-}
      # Word-to-PDF for generated documents (docs/markets.md s6).
      PDF_CONVERTER_URL: ${PDF_CONVERTER_URL:-http://gotenberg:3000}
      DISPOSITION_SWEEP: ${DISPOSITION_SWEEP:-on}
      DISPOSITION_SWEEP_HOUR_UTC: ${DISPOSITION_SWEEP_HOUR_UTC:-13}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_POSTAL_ADDRESS: ${EMAIL_POSTAL_ADDRESS:-}
      MESSAGING_BRAND_NAME: ${MESSAGING_BRAND_NAME:-}
      MESSAGING_HELP_CONTACT: ${MESSAGING_HELP_CONTACT:-}
      SMS_KEYWORD_REPLIES: ${SMS_KEYWORD_REPLIES:-app}
      USE_SENDGRID: ${USE_SENDGRID:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}

      ATTOM_API_KEY: ${ATTOM_API_KEY:-}
      ATTOM_BASE_URL: ${ATTOM_BASE_URL:-https://api.gateway.attomdata.com}
      GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY:-}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
      REALIE_API_KEY: ${REALIE_API_KEY:-}
      REGRID_API_TOKEN: ${REGRID_API_TOKEN:-}
      SOURCING_SCHEDULER: ${SOURCING_SCHEDULER:-on}
      SOURCING_RUN_HOUR_UTC: ${SOURCING_RUN_HOUR_UTC:-6}
      AGENT_SWEEP: ${AGENT_SWEEP:-on}
      AUTO_ENRICH: ${AUTO_ENRICH:-on}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      AGENT_SWEEP_HOUR_UTC: ${AGENT_SWEEP_HOUR_UTC:-7}
      AGENT_SWEEP_STALE_DAYS: ${AGENT_SWEEP_STALE_DAYS:-7}
      AGENT_FOLLOWUP_DAYS: ${AGENT_FOLLOWUP_DAYS:-3}
      AGENT_FOLLOWUP_MAX: ${AGENT_FOLLOWUP_MAX:-3}
      OUTREACH_STRONG_TIER_MIN_ARV: ${OUTREACH_STRONG_TIER_MIN_ARV:-400000}
      BATCH_SKIPTRACE_API_KEY: ${BATCH_SKIPTRACE_API_KEY:-}
      SKIP_TRACE_PROVIDER: ${SKIP_TRACE_PROVIDER:-batch}

      # DocuSign JWT grant; normally saved on the Integrations page instead (docs/integrations/docusign.md)
      DOCUSIGN_BASE_URL: ${DOCUSIGN_BASE_URL:-}
      DOCUSIGN_CLIENT_ID: ${DOCUSIGN_CLIENT_ID:-}
      DOCUSIGN_USER_ID: ${DOCUSIGN_USER_ID:-}
      DOCUSIGN_ACCOUNT_ID: ${DOCUSIGN_ACCOUNT_ID:-}
      DOCUSIGN_RSA_PRIVATE_KEY: ${DOCUSIGN_RSA_PRIVATE_KEY:-}
      DOCUSIGN_ENV: ${DOCUSIGN_ENV:-demo}
      DOCUSIGN_CONNECT_SECRET: ${DOCUSIGN_CONNECT_SECRET:-}
      # Inbound email: Reply-To on every send, token for the Inbound Parse webhook
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      INBOUND_EMAIL_TOKEN: ${INBOUND_EMAIL_TOKEN:-}

      # Inside the compose network, not localhost.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-halo-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      # Caddy reaches this over the compose network; this mapping exists for
      # local debugging over SSH only.
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3001/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: halo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.haloacquisitions.com/api}
      NEXT_PUBLIC_DESCOPE_PROJECT_ID: ${DESCOPE_PROJECT_ID}
      NEXT_PUBLIC_DESCOPE_FLOW_ID: ${NEXT_PUBLIC_DESCOPE_FLOW_ID:-sign-in}
      # Required when the Descope project uses a custom domain.
      NEXT_PUBLIC_DESCOPE_BASE_URL: ${DESCOPE_BASE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: halo-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Paid calls are proxied to the /internal routes, so the worker cannot do
      # useful work until the api is serving.
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-halo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-halo_prod}?schema=public}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      WORKER_HEALTH_PORT: 3003

      # Over the compose network, never the public hostname: /api/internal is
      # blocked at the edge by design (see Caddyfile).
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:3001/api}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}

      # Model choice only. The api holds the OpenAI key and does the spending,
      # so every token is preflighted and lands on the cost ledger.
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_DAILY_COST_CAP: ${OPENAI_DAILY_COST_CAP:-5}
      AGENT_FOLLOWUP_MAX: ${AGENT_FOLLOWUP_MAX:-3}
      OUTREACH_STRONG_TIER_MIN_ARV: ${OUTREACH_STRONG_TIER_MIN_ARV:-400000}
      AGENT_MATCHER_CANDIDATES: ${AGENT_MATCHER_CANDIDATES:-15}
      AGENT_MATCHER_SHORTLIST_MAX: ${AGENT_MATCHER_SHORTLIST_MAX:-10}

      # No TWILIO_PHONE_NUMBER: the api sends approved messages by id and
      # owns the sender number.

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3003/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    container_name: halo-caddy
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
