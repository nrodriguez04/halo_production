name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs also run the agents' live eval when its key is set.
  workflow_dispatch:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build shared package
        run: npm run build -w @halo/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build all
        run: npm run build

      - name: Verify runtime entrypoints
        # The Dockerfiles run `node dist/main`. An import that reaches outside
        # src/ widens the TypeScript root and silently moves the output to
        # dist/src/main.js, which builds fine and then fails to start.
        run: |
          test -f apps/api/dist/main.js
          test -f apps/worker/dist/main.js
          test ! -e apps/api/dist/src

      - name: Run tests
        run: npm test

  migration-check:
    runs-on: ubuntu-latest
    needs: lint-typecheck-build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: halo
          POSTGRES_PASSWORD: halo_dev_password
          POSTGRES_DB: halo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Word-to-PDF (docs/markets.md s6): the same image as
      # docker-compose.prod.yml, so generated agreements are converted for real.
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Wait for Gotenberg
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 2
          done
          echo "Gotenberg did not come up" && exit 1

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://halo:halo_dev_password@localhost:5432/halo_test
        run: cd apps/api && npx prisma migrate deploy

      - name: Generate Prisma client
        run: npm run db:generate

      # The api resolves @halo/shared's types from its build output.
      - name: Build shared package
        run: npm run build -w @halo/shared

      # The contract-flipping lifecycle (docs/contract-flipping.md) through the
      # real services against the migrated database: synthetic fixtures on
      # throwaway tenants, nothing sent (the queue is stubbed).
      - name: Contract-flipping lifecycle (real database)
        env:
          INTEGRATION_DATABASE_URL: postgresql://halo:halo_dev_password@localhost:5432/halo_test
          PDF_CONVERTER_URL: http://localhost:3000
        run: npm run test:integration -w @halo/api

  agents-eval:
    # The agents' golden set (docs/agent-eval.md): every case replayed
    # through the real agent against its recorded model reply, free and
    # deterministic. When the EVAL_OPENAI_API_KEY secret is set, a change to
    # a prompt, an agent or the golden set (or a manual run) also asks the
    # real models and must keep each agent's decision agreement above its
    # threshold: about $0.35 a run, stopped at $2.
    runs-on: ubuntu-latest
    env:
      # Whether the key exists; the key itself only reaches the live step.
      LIVE_EVAL: ${{ secrets.EVAL_OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build -w @halo/shared

      - name: Golden set, recorded replies
        run: npm run agents:eval -- --report "$RUNNER_TEMP/agents-eval.md"

      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/agents-eval.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Did prompts, agents or the golden set change?
        id: changes
        if: env.LIVE_EVAL == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE"
          fi
          if git diff --name-only "$base"...HEAD -- packages/shared/src/agents apps/worker/src/agents apps/worker/eval | grep -q .; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Golden set, live models
        if: steps.changes.outputs.live == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
        run: npm run agents:eval -- --live --via openai --max-cost-usd 2 --report "$RUNNER_TEMP/agents-eval-live.md"

      - name: Live report
        if: always() && steps.changes.outputs.live == 'true'
        run: cat "$RUNNER_TEMP/agents-eval-live.md" >> "$GITHUB_STEP_SUMMARY" || true

  docker-images:
    # The production images (docker-compose.prod.yml) built from the same
    # Dockerfiles a deploy uses. Nothing built them in CI before, and they
    # had stopped building without anyone seeing it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.app }} image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t halo-${{ matrix.app }}:ci .

  agents-tests:
    # The CrewAI runtime is Python and outside the npm workspaces. Only the
    # api-client tests run here: they need httpx + pytest, not crewai (which
    # is heavy and exercised at import time locally, see apps/agents/README).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install httpx pytest
      - name: Client tests
        run: python -m pytest -q tests/test_halo_client.py
